version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    level: DEBUG
    formatter: simple
  file:
    class: logging.FileHandler
    filename: app.log
    level: INFO
    formatter: simple
loggers:
  asyncio:
    level: WARNING
  uvicorn:
    level: WARNING
    propagate: false
  uvicorn.access:
    level: WARNING
    propagate: false
  connexion:
    level: WARNING
    propagate: false
root:
  level: DEBUG
  handlers: [console, file]
